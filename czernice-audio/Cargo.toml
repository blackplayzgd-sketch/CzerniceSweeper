[package]
name = "czernice-audio"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
strip = true
lto = "fat"
codegen-units = 1
debug = false


[dependencies]
jni = "0.22.4"
maudio = { version = "0.1.15", path = "maudio" }
mvutils = "1.7.2"
libc = "0.2.191"
paste = "1.0.15"
czernice-audio-proc-macro = { version = "0.1.0", path = "Proc" }
