[package]
name = "maudio"
version = "0.1.15"
license = "MIT"
rust-version = "1.70"
edition = "2021"
repository = "https://github.com/someotherself/maudio"
homepage = "https://github.com/someotherself/maudio"
documentation = "https://docs.rs/maudio/latest/maudio/"
description = "All-in-one cross-platform audio library for Rust, powered by miniaudio."
categories = ["multimedia::audio", "multimedia"]
keywords = ["audio", "miniaudio", "playback", "recording", "asio"]

[features]
default = ["engine"]
ci-tests = []
use-global-allocator = []
vorbis = ["maudio-sys/vorbis"]
debug-build = ["maudio-sys/debug-build"]
engine = ["maudio-sys/engine"]
generate-bindings = ["maudio-sys/generate-bindings"]
supplybin = ["maudio-sys/supplybin"]
external-lib = ["maudio-sys/external-lib"]
worklet = ["maudio-sys/worklet"]

# feature that enable examples
example-sdl2 = ["dep:sdl2"]
example-symphonia = ["dep:symphonia"]
example-asio = ["dep:asio-sys"]

[dependencies]
maudio-sys = "0.1.9"

[dependencies.sdl2]
version= "0.38.0"
optional = true
features = ["bundled"]

[dependencies.symphonia]
version= "0.6.0"
optional = true
features = ["aac"]

[dependencies.asio-sys]
version = "0.4.0"
optional = true
